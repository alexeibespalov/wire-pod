# Written by deploy/pizero/music.sh (Cortana). The NAS music share, played on the Echo.
music_directory     "/mnt/music"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
playlist_directory  "/var/lib/mpd/playlists"
sticker_file        "/var/lib/mpd/sticker.sql"
log_file            "syslog"
user                "mpd"
bind_to_address     "0.0.0.0"      # cortana-agent on the Pi 5 drives it (LAN only)
port                "6600"
auto_update         "no"
restore_paused      "yes"
zeroconf_enabled    "no"
filesystem_charset  "UTF-8"
audio_buffer_size   "4096"         # KiB: rides out Wi-Fi/Bluetooth hiccups on the Zero

audio_output {
    type            "alsa"
    name            "Echo Show"
    device          "cortana_speaker"
    mixer_type      "software"
    format          "44100:16:2"   # what the Echo runs at (bluealsa --a2dp-force-audio-cd)
}
