# foot for Cortana's screen: 480x320 as 40 columns x 15 rows of 12x21-pixel cells.
# pixelsize 20 gives JetBrains Mono 12-pixel-wide cells; line-height is in points, and 16.0
# makes 21-pixel rows (16.2 is too tall). The 15th row needs cage -d (no foot title bar).
[main]
font=JetBrains Mono:pixelsize=20
font-bold=JetBrains Mono:pixelsize=20:weight=bold
line-height=16.0
pad=0x0 center

[scrollback]
lines=0

[cursor]
blink=no

[mouse]
hide-when-typing=yes

[colors]
background=020806
foreground=6dffd2
