# foot for Cortana's screen: 480x320 as 40 columns x 14 rows.
# pixelsize 20 gives JetBrains Mono 12-pixel-wide cells. foot reads line-height in points
# for this panel: 16.0 is the largest that still gives 14 rows (16.2 gives 13; 22.85 read as points gave 10).
[main]
font=JetBrains Mono:pixelsize=20
font-bold=JetBrains Mono:pixelsize=20:weight=bold
line-height=16.0
pad=0x0 center

[scrollback]
lines=0

[cursor]
blink=no

[mouse]
hide-when-typing=yes

[colors]
background=020806
foreground=6dffd2
