# wire-pod for Vector X4J8 (192.168.1.150)
#
# Host networking: in IP mode wire-pod writes its own detected IP into Vector's
# server_config + TLS cert, so it must see the Pi's LAN IP, not a Docker bridge IP.
#
# Ports (on the host):
#   8443 - chipper (Vector voice/jdocs/token). NOT 443: Tailscale Funnel holds 443.
#   8084 - chipper 2.0.1-compat listener
#   80   - connCheck (Vector's /ok probe)
#   8080 - web UI  -> http://192.168.1.39:8080
services:
  wire-pod:
    image: ghcr.io/kercre123/wire-pod:main
    container_name: wire-pod
    network_mode: host
    restart: unless-stopped
    environment:
      WIREPOD_DATA_DIR: /data
      WIREPOD_STT_SERVICE: vosk
      WIREPOD_STT_LANGUAGE: en-US
      WIREPOD_USE_INBUILT_BLE: "false"
      # Speech-to-text: Whisper (vector-whisper below) with Vosk as the instant fallback.
      # Benchmarked on real requests (deploy/pi/stt-bench): whisper.cpp base.en with a 15 s
      # window fixed Vosk's mistakes at ~1.8 s per request. Remove to go back to Vosk only.
      WHISPER_HTTP: http://127.0.0.1:10330
      WHISPER_TIMEOUT: "6"
    volumes:
      - ./data:/data
      # SDK info (session cert + sdk_config.ini) wire-pod writes for Python/Go SDK clients
      - ./data/anki_vector:/opt/.anki_vector
      # Pruned voice-command keywords (more speech falls through to the LLM).
      # Source: intent-data/build_intents.py; stock file: intent-data/en-US.original.json.
      # To revert: delete this line and `docker compose up -d wire-pod`.
      - ./intent-data/en-US.json:/opt/wire-pod/chipper/intent-data/en-US.json:ro
      # Upstream bug: settings saves replace the /data symlink -> lost on recreate.
      # This wrapper copies them back to ./data. See persist-sync.sh.
      - ./persist-sync.sh:/persist-sync.sh:ro
      # Patched chipper: closes the gRPC streams upstream leaves open on every reply (they
      # jam Vector's gateway after a few dozen turns). Built by chipper-patch/build.sh from
      # this image's own source. To revert: delete this line and `docker compose up -d wire-pod`.
      - ./chipper-patch/chipper:/opt/wire-pod/chipper/chipper:ro
      # Face-screen images written by vector-agent (agent-data/face), shown via Lua showImage("/face/..")
      - ./agent-data/face:/face:ro
      - /etc/localtime:/etc/localtime:ro
    command: ["bash", "/persist-sync.sh"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Vector's brain: LangGraph ReAct agent (source: <repo>/vector-agent, synced to ./vector-agent).
  # wire-pod Knowledge provider = Custom, endpoint http://127.0.0.1:8091/v1 (localhost only),
  # dummy key. Real LLM key + upstream live in ./.env (chmod 600).
  # State (conversation threads, memories) in ./agent-data.
  # Vector's own Whisper (whisper.cpp server, base.en loaded once), localhost only. Separate
  # from Home Assistant's Whisper container. Build: ./whisper-cpp/build.sh
  vector-whisper:
    image: ghcr.io/kercre123/wire-pod:main    # same runtime the server was built in
    container_name: vector-whisper
    network_mode: host
    restart: unless-stopped
    entrypoint: ["/whisper/whisper-server", "-m", "/whisper/ggml-base.en.bin", "--host", "127.0.0.1",
                 "--port", "10330", "-t", "4", "-l", "en", "-ac", "768"]
    volumes:
      - ./whisper-cpp:/whisper:ro

  vector-agent:
    build:
      context: .                       # ~/wire-pod: the image also needs ./agent-core (see .dockerignore)
      dockerfile: vector-agent/Dockerfile
    image: vector-agent:local
    container_name: vector-agent
    network_mode: host
    restart: unless-stopped
    # vector.common.env: settings that do not depend on the brain profile (belief store, A2A,
    # the other assistant). ./use-llm.sh rewrites .env from a profile, so anything that must
    # survive a profile switch lives here. .env is listed last and wins on a clash.
    env_file:
      - vector.common.env
      - .env
    environment:
      LISTEN_HOST: 127.0.0.1
      LISTEN_PORT: "8091"
      WIREPOD_URL: http://127.0.0.1:8080
      VECTOR_SERIAL: "00609161"
      AGENT_TZ: Europe/London
    volumes:
      - ./agent-data:/data
      # Vector SDK config + session cert (written by wire-pod) for the listen-only face watcher;
      # the ini points the cert at /opt/.anki_vector, so mount it there too
      - ./data/anki_vector:/home/agent/.anki_vector:ro
      - ./data/anki_vector:/opt/.anki_vector:ro
      # NAS music (the Pi's existing CIFS automount of the OMV share), read-only.
      # rslave so the automount (it idles out after 60s) propagates into the container.
      - type: bind
        source: /mnt/shared_media
        target: /media
        read_only: true
        bind:
          propagation: rslave
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cortana: the voice assistant on the Pi Zero satellite (192.168.1.96, wyoming-satellite) -
  # Vector's ReAct agent without the robot (source: <repo>/cortana-agent, synced to
  # ./cortana-agent). It connects OUT to the satellite (taking the place Home Assistant's
  # Wyoming integration had), hears through vector-whisper and speaks through piper.
  # Claude key etc. in ./cortana.env (chmod 600, separate from Vector's .env so use-llm.sh
  # never switches her). State in ./cortana-data. Text test door: 127.0.0.1:8092.
  cortana-agent:
    build:
      context: .
      dockerfile: cortana-agent/Dockerfile
    image: cortana-agent:local
    container_name: cortana-agent
    network_mode: host
    restart: unless-stopped
    env_file: cortana.env
    environment:
      LISTEN_HOST: 127.0.0.1
      LISTEN_PORT: "8092"
      AGENT_TZ: Europe/London
      WHISPER_URL: http://127.0.0.1:10330
      PIPER_URI: tcp://127.0.0.1:10200
      # YouTube Music: MPD on the satellite fetches tracks from here (only signed stream
      # addresses are served on this port). Vector's player is in his own container and
      # uses his main door, so he needs no such port.
      YTMUSIC_STREAM_PORT: "8097"
      YTMUSIC_STREAM_BASE: http://192.168.1.39:8097
    volumes:
      - ./cortana-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
